services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liftai
      POSTGRES_PASSWORD: liftai
      POSTGRES_DB: liftai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liftai -d liftai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
